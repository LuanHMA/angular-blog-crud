<main class="p-6 w-full max-w-4xl mx-auto space-y-4">
    <h1 class="font-sans text-4xl font-semibold sm:text-6xl">All Posts</h1>

    @if(isLoading()){
    <app-posts-loading />
    }
    @else if(error() !== null){
    <p class="bg-red-950/80 w-full p-4 text-red-400 tracking-wide text-lg">
        {{ error() }}
    </p>
    }

    @else {
    <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 2xl:grid-cols-4 gap-4">
        @for(post of posts(); track post.id){
        <a [routerLink]="[post.id]"
            class="flex flex-col items-start gap-1 p-4 bg-neutral-800 transition-all hover:bg-neutral-900">
            <span class="text-xs font-semibold text-neutral-400 uppercase">Title:</span>
            <h2 class="text-lg font-medium text-neutral-50 capitalize">{{post.title}}</h2>
        </a>
        }
    </section>
    }
</main>
